#Below configurations junit platform launcher apply to junit.jupiter (i.e. Jupiter Test Engine)

#Enable/Disable parallel execution, Default is 'false'
junit.jupiter.execution.parallel.enabled=true

#Run methods within a test class in parallel, Default value is 'same_thread' means sequentially
junit.jupiter.execution.parallel.mode.default=concurrent

#Multiple Test Classes can be executed in parallel, Default value is 'same_thread' means sequentially
junit.jupiter.execution.parallel.mode.classes.default=concurrent

#Thread Pool managing strategy
    # "dynamic" (default) : Thread pool size computed dynamically based on system resource
    # "fixed" : We define specific number of threads within a pool
junit.jupiter.execution.parallel.config.strategy=fixed

#Used when we use thread pool strategy as 'fixed', Below it creates thread pool with 5 threads
junit.jupiter.execution.parallel.config.fixed.parallelism=5
